<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Manrope:wght@600&display=block" rel="stylesheet">
<style>
body{margin:0;width:1200px;height:630px;background:#302019;color:#F7F3EB;font-family:'Cormorant Garamond',serif;position:relative;overflow:hidden}
.glow{position:absolute;right:-180px;top:-200px;width:760px;height:760px;border-radius:50%;background:radial-gradient(closest-side,rgba(183,122,72,.55),transparent)}
.wrap{position:absolute;inset:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{font-family:Manrope,sans-serif;font-size:16px;letter-spacing:.28em;text-transform:uppercase;color:#E5D7C4;display:flex;align-items:center;gap:16px}
.eyebrow i{display:inline-block;width:40px;height:1px;background:#B77A48}
h1{font-weight:400;font-size:108px;line-height:.92;margin:0;text-transform:uppercase;letter-spacing:-.01em}
h1 em{color:#B77A48}
.foot{display:flex;justify-content:space-between;align-items:center;font-family:Manrope,sans-serif;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:#E5D7C4}
.mark{font-family:'Cormorant Garamond';font-size:38px;letter-spacing:0;text-transform:none;color:#F7F3EB;display:flex;align-items:center;gap:12px}
.mark b{font-weight:400;width:36px;height:36px;border:1px solid currentColor;border-radius:50%;display:grid;place-items:center;font-size:22px}
.mark s{text-decoration:none;font-family:Manrope;font-size:13px;letter-spacing:.3em;text-transform:uppercase}
</style></head><body><div class="glow"></div><div class="wrap">
<div class="eyebrow"><i></i>Specialty coffee &amp; brunch · Little Neck, Queens</div>
<h1>Good coffee.<br>Great company.<br><em>One of a kind.</em></h1>
<div class="foot"><span class="mark"><em>Café</em><b>1</b><s>of a kind</s></span><span>255-13 Northern Blvd · Little Neck, NY</span></div>
</div></body></html>
